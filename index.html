<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CurrencyX &mdash; Real-Time Currency Converter</title>
  
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- FontAwesome for sleek icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Ambient background glow elements -->
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <main class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="logo-icon">
        <i class="fa-solid fa-arrows-rotate"></i>
      </div>
      <div>
        <h1 class="app-title">CurrencyX</h1>
        <p class="app-subtitle">Real-time global exchange rates</p>
      </div>
    </header>

    <!-- Main Converter Glass Card -->
    <div class="converter-card">
      <!-- Amount Input Section -->
      <div class="input-section">
        <label for="amount" class="input-label">
          <span>Amount</span>
          <span class="active-currency-badge" id="amount-currency-badge">USD</span>
        </label>
        <div class="amount-input-wrapper">
          <span class="currency-symbol" id="currency-symbol">$</span>
          <input type="number" id="amount" value="100" min="0" step="any" placeholder="0.00" autocomplete="off" />
        </div>

        <!-- Quick Amount Presets -->
        <div class="quick-presets">
          <button type="button" class="preset-btn" data-preset="10">$10</button>
          <button type="button" class="preset-btn active" data-preset="100">$100</button>
          <button type="button" class="preset-btn" data-preset="500">$500</button>
          <button type="button" class="preset-btn" data-preset="1000">$1,000</button>
          <button type="button" class="preset-btn" data-preset="5000">$5,000</button>
        </div>
      </div>

      <!-- Selectors Section -->
      <div class="selectors-grid">
        <!-- From Currency -->
        <div class="select-box">
          <label for="from-currency" class="input-label">From</label>
          <div class="select-wrapper">
            <div class="flag-container">
              <img id="from-flag" src="https://flagcdn.com/w40/us.png" alt="USD Flag" class="flag-img" />
            </div>
            <select id="from-currency" class="custom-select"></select>
            <i class="fa-solid fa-chevron-down select-chevron"></i>
          </div>
        </div>

        <!-- Swap Button -->
        <div class="swap-action">
          <button id="swap-btn" class="swap-btn" title="Swap Currencies" aria-label="Swap Currencies">
            <i class="fa-solid fa-right-left"></i>
          </button>
        </div>

        <!-- To Currency -->
        <div class="select-box">
          <label for="to-currency" class="input-label">To</label>
          <div class="select-wrapper">
            <div class="flag-container">
              <img id="to-flag" src="https://flagcdn.com/w40/eu.png" alt="EUR Flag" class="flag-img" />
            </div>
            <select id="to-currency" class="custom-select"></select>
            <i class="fa-solid fa-chevron-down select-chevron"></i>
          </div>
        </div>
      </div>

      <!-- Result Card Container -->
      <div class="result-card">
        <div class="result-header">
          <span class="rate-status" id="rate-status">
            <span class="live-dot"></span> Live Market Rate
          </span>
          <span class="last-updated" id="last-updated">Updated just now</span>
        </div>
        
        <div class="converted-output">
          <div class="result-amount-container">
            <span class="result-number" id="converted-amount-text">--</span>
          </div>
          <p class="rate-details" id="exchange-rate-text">Fetching rates...</p>
          <p class="inverse-rate" id="inverse-rate-text"></p>
        </div>
      </div>
    </div>

    <!-- Footer Footer Info -->
    <footer class="app-footer">
      <p><i class="fa-solid fa-shield-halved"></i> Powered by open exchange data &bull; Updated automatically</p>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
